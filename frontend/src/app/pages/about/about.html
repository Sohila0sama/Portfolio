  <div class="about-section" *ngIf="aboutData">
      <div class="container">
    <div class="about-header">
      <h2>About <span>Sir Magdi</span></h2>

    </div>

    <div class="about-grid">
      <!-- Text -->
      <div class="about-text">
              <h3>{{ aboutData.title }}</h3>

        <p>
          {{ aboutData.description }}
        </p>
      </div>

     <!-- Stats -->
      <div class="about-stats">

        <div class="stat-card">
          <h4>{{ aboutData.experience }}</h4>
          <span>Graduated, Cairo University</span>
        </div>

        <div class="stat-card">
          <h4>{{ aboutData.projects }}+</h4>
          <span>Transplant Operations</span>
        </div>

        <div class="stat-card">
          <h4>{{ aboutData.problem }}</h4>
          <span>Knighted</span>
        </div>

        <div class="stat-card">
          <h4>{{ aboutData.technologies }}</h4>
          <span>Aswan Heart Centre Founded</span>
        </div>

      </div>
    </div>
    </div>
  </div>
