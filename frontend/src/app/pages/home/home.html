<div class="hero container" *ngIf="homeData">
  <!-- Text -->
  <div class="hero-text">

    <span class="badge">
      {{ homeData.title }}
    </span>

    <h1>
      Professor Sir <span>{{ homeData.name }}</span>
    </h1>

    <p class="subtitle">
      {{ homeData.description }}
    </p>

    <div class="actions">
      <a class="btn ghost" [href]="homeData.linkedin" target="_blank">Biography</a>
      <a class="btn primary" [href]="homeData.cv" target="_blank">Global Heart Foundation</a>
      <a class="btn ghost" [href]="homeData.github" target="_blank">BHF Recognition</a>
    </div>

    <!-- Focus areas -->
    <div class="working-with" *ngIf="homeData.workingWith?.length">

      <span>Focus Areas</span>

      <div class="tech-list">
        <div class="tech" *ngFor="let tech of homeData.workingWith">
          {{ tech }}
        </div>
      </div>

    </div>

  </div>

  <!-- Image -->
  <div class="hero-img">
    <img [src]="'http://localhost:4000/' + homeData.image" [alt]="homeData.name">
  </div>

</div>
